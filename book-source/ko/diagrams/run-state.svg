<svg xmlns="http://www.w3.org/2000/svg" id="diagram-1" width="404.7578125" class="flowchart" style="max-width: 404.7578125px;" viewBox="0 0 404.7578125 289" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-diagram-1" aria-labelledby="chart-title-diagram-1" height="289"><title id="chart-title-diagram-1">실행 상태와 재개</title><desc id="chart-desc-diagram-1">Running은 승인, 입력, 효과 확인이 필요하면 Waiting으로 전환한다. 완료, 실패, 취소, 한도 도달 시 Terminal로 끝난다. Waiting에서 유효한 ResumeCommand를 수락하면 새 Running segment가 시작된다.</desc><style>#diagram-1{font-size:17px;fill:#20382b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-1 .error-icon{fill:#f7f1e4;}#diagram-1 .error-text{fill:#080e1b;stroke:#080e1b;}#diagram-1 .edge-thickness-normal{stroke-width:1px;}#diagram-1 .edge-thickness-thick{stroke-width:3.5px;}#diagram-1 .edge-pattern-solid{stroke-dasharray:0;}#diagram-1 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-1 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-1 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-1 .marker{fill:#527d63;stroke:#527d63;}#diagram-1 .marker.cross{stroke:#527d63;}#diagram-1 svg{font-size:17px;}#diagram-1 p{margin:0;}#diagram-1 .label{color:#20382b;}#diagram-1 .cluster-label text{fill:#080e1b;}#diagram-1 .cluster-label span{color:#080e1b;}#diagram-1 .cluster-label span p{background-color:transparent;}#diagram-1 .label text,#diagram-1 span{fill:#20382b;color:#20382b;}#diagram-1 .node rect,#diagram-1 .node circle,#diagram-1 .node ellipse,#diagram-1 .node polygon,#diagram-1 .node path{fill:#e8f2eb;stroke:#527d63;stroke-width:1px;}#diagram-1 .rough-node .label text,#diagram-1 .node .label text,#diagram-1 .image-shape .label,#diagram-1 .icon-shape .label{text-anchor:middle;}#diagram-1 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-1 .rough-node .label,#diagram-1 .node .label,#diagram-1 .image-shape .label,#diagram-1 .icon-shape .label{text-align:center;}#diagram-1 .node.clickable{cursor:pointer;}#diagram-1 .root .anchor path{fill:#527d63!important;stroke-width:0;stroke:#527d63;}#diagram-1 .arrowheadPath{fill:#0b0b0b;}#diagram-1 .edgePath .path{stroke:#527d63;stroke-width:1px;}#diagram-1 .flowchart-link{stroke:#527d63;fill:none;}#diagram-1 .edgeLabel{background-color:#f7f1e4;text-align:center;}#diagram-1 .edgeLabel p{background-color:#f7f1e4;}#diagram-1 .edgeLabel rect{opacity:0.5;background-color:#f7f1e4;fill:#f7f1e4;}#diagram-1 .labelBkg{background-color:rgba(247, 241, 228, 0.5);}#diagram-1 .cluster rect{fill:#f7f1e4;stroke:hsl(41.0526315789, 14.2857142857%, 83.137254902%);stroke-width:1px;}#diagram-1 .cluster text{fill:#080e1b;}#diagram-1 .cluster span{color:#080e1b;}#diagram-1 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-size:12px;background:#f7f1e4;border:1px solid hsl(41.0526315789, 14.2857142857%, 83.137254902%);border-radius:2px;pointer-events:none;z-index:100;}#diagram-1 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#20382b;}#diagram-1 rect.text{fill:none;stroke-width:0;}#diagram-1 .icon-shape,#diagram-1 .image-shape{background-color:#f7f1e4;text-align:center;}#diagram-1 .icon-shape p,#diagram-1 .image-shape p{background-color:#f7f1e4;padding:2px;}#diagram-1 .icon-shape .label rect,#diagram-1 .image-shape .label rect{opacity:0.5;background-color:#f7f1e4;fill:#f7f1e4;}#diagram-1 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram-1 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram-1 .node .neo-node{stroke:#527d63;}#diagram-1 [data-look="neo"].node rect,#diagram-1 [data-look="neo"].c